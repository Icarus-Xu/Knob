; Knob 最小硬件调试固件：ESP32-S3 + GC9A01 + EC11
; 方案见 docs/旋钮-最小硬件调试方案.md（不连车机、不做 BLE，先跑通屏显 + 旋钮交互）
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D ARDUINO_USB_MODE=0
lib_deps =
	moononournation/GFX Library for Arduino@1.2.1
; lvgl 走 git submodule（firmware/lib/lvgl，锁定 v8.1.0），不走 lib_deps 注册表拉取。
; lv_conf.h 放在 lib/lv_conf.h（lvgl 文件夹的同级目录，LVGL 官方文档方案 1）：
; lvgl 内部用 "../../lv_conf.h" 相对路径找它，不依赖 -I 参数，
; 不会像方案 2（LV_CONF_INCLUDE_SIMPLE + include/ 目录）那样因为 PlatformIO
; 不会把项目 include/ 目录传给 lib/ 库内部源文件而找错配置。
